name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

auto_cancel: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Automatically bump app version
        id: bump_version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          name_match = re.search(r"versionName\s+'(\d+)\.(\d+)\.(\d+)'", text)
          code_match = re.search(r"versionCode\s+(\d+)", text)
          if not name_match or not code_match:
              raise SystemExit("Could not find versionName/versionCode")

          major, minor, patch = map(int, name_match.groups())
          old_name = f"{major}.{minor}.{patch}"
          new_name = f"{major}.{minor}.{patch + 1}"
          old_code = int(code_match.group(1))
          new_code = old_code + 1

          text = re.sub(
              r"versionName\s+'\d+\.\d+\.\d+'",
              f"versionName '{new_name}'",
              text,
              count=1,
          )
          text = re.sub(
              r"versionCode\s+\d+",
              f"versionCode {new_code}",
              text,
              count=1,
          )
          path.write_text(text)

          print(f"Version: {old_name} -> {new_name}")
          print(f"Version code: {old_code} -> {new_code}")
          with open("$GITHUB_OUTPUT", "a") as output:
              output.write(f"version={new_name}\n")
              output.write(f"version_code={new_code}\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          if git diff --cached --quiet; then
            echo "No version change needed."
          else
            git commit -m "chore: bump app version to ${{ steps.bump_version.outputs.version }} [skip ci]"
            git push
          fi

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Gradle
        run: gradle --version

      - name: Prepare release keystore
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$AUREN_KEYSTORE_B64"
          test -n "$AUREN_STORE_PASS"
          KEYSTORE="$RUNNER_TEMP/auren-release.keystore"
          CLEAN_B64=$(printf '%s' "$AUREN_KEYSTORE_B64" | tr -d '[:space:]')
          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$AUREN_STORE_PASS" >/dev/null
          echo "Release keystore decoded and validated successfully."

      - name: Build signed release APK
        env:
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: gradle --no-daemon clean assembleRelease --stacktrace

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          test -n "$VERSION_NAME"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME"

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK size: $APK_SIZE bytes"

      - name: Prepare release metadata
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Auren-Music-Player-${RELEASE_TAG}.apk"
          sha256sum "Auren-Music-Player-${RELEASE_TAG}.apk" > "Auren-Music-Player-${RELEASE_TAG}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auren-Music-Player-${{ steps.release.outputs.tag }}
          path: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: Auren Music Player ${{ steps.release.outputs.tag }}
          body: |
            ## Auren Music Player ${{ steps.release.outputs.tag }}

            Signed release APK generated automatically from `main`.

            - Android package: `com.auren.musicplayer`
            - Version: `${{ steps.version.outputs.version }}`
            - APK is signed with the project's protected release key.
            - SHA-256 checksum is included as a release asset.
          files: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk.sha256
          fail_on_unmatched_files: true
