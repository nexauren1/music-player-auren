name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release keystore
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$AUREN_KEYSTORE_B64"
          test -n "$AUREN_STORE_PASS"
          KEYSTORE="$RUNNER_TEMP/auren-release.keystore"
          printf '%s' "$AUREN_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$AUREN_STORE_PASS" >/dev/null

      - name: Build signed AAB and APK
        env:
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: gradle --no-daemon clean bundleRelease assembleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-play"
          cp app/build/outputs/bundle/release/app-release.aab "Auren-Music-Player-${TAG}.aab"
          cp app/build/outputs/apk/release/app-release.apk "Auren-Music-Player-${TAG}.apk"
          sha256sum "Auren-Music-Player-${TAG}.aab" "Auren-Music-Player-${TAG}.apk" > "Auren-Music-Player-${TAG}.sha256"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Auren-Music-Player-${{ steps.release.outputs.tag }}
          path: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.aab
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Auren Music Player ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.aab
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.sha256
