name: Android Build & Release

# Nexauren Android CI/CD
# - Pull requests / main: build only
# - v* tags: signed release + GitHub Release
# - No automatic releases on normal commits

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

      - name: Build Android app
        id: build
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ -z "$AUREN_KEYSTORE_B64" ] || \
               [ -z "$AUREN_KEY_ALIAS" ] || \
               [ -z "$AUREN_KEY_PASS" ] || \
               [ -z "$AUREN_STORE_PASS" ]; then
              echo "A signed release requires AUREN_KEYSTORE_B64, AUREN_KEY_ALIAS, AUREN_KEY_PASS and AUREN_STORE_PASS."
              exit 1
            fi

            printf '%s' "$AUREN_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$AUREN_KEYSTORE_PATH"
            test -s "$AUREN_KEYSTORE_PATH"
            keytool -list -keystore "$AUREN_KEYSTORE_PATH" -storepass "$AUREN_STORE_PASS" >/dev/null

            gradle --no-daemon clean assembleRelease --stacktrace
            MODE="signed"
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            gradle --no-daemon clean assembleDebug --stacktrace
            MODE="debug"
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$APK"
          cp "$APK" Nexauren-Music-Player.apk
          sha256sum Nexauren-Music-Player.apk > Nexauren-Music-Player.apk.sha256

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexauren-Music-Player-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: |
            Nexauren-Music-Player.apk
            Nexauren-Music-Player.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            Nexauren-Music-Player.apk \
            Nexauren-Music-Player.apk.sha256 \
            --title "Nexauren Music Player $VERSION" \
            --generate-notes

      - name: Build summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.build.outputs.mode }}
        run: |
          {
            echo "## Nexauren Music Player"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Build mode: \`$MODE\`"
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "- Release: published from version tag"
            else
              echo "- Release: not published (build validation only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
