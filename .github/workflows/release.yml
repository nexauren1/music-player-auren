name: Build APK and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] \
            || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing release signing secrets."
            echo "Configure AUREN_KEYSTORE_B64, AUREN_STORE_PASS,"
            echo "AUREN_KEY_ALIAS and AUREN_KEY_PASS in GitHub Secrets."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/auren-signing"

          printf '%s' "$KEYSTORE_B64" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$RUNNER_TEMP/auren-signing/auren-release.keystore"

          test -s "$RUNNER_TEMP/auren-signing/auren-release.keystore"
          echo "AUREN_KEYSTORE_PATH=$RUNNER_TEMP/auren-signing/auren-release.keystore" \
            >> "$GITHUB_ENV"
          echo "AUREN_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "AUREN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUREN_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK 36 is ready"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" \
            app/build.gradle | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read versionName"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Create automatic release tag
        id: release_tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" \
            "Auren-Music-Player-${{ steps.release_tag.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}-signed
          target_commitish: ${{ github.sha }}
          name: Auren Music Player ${{ steps.release_tag.outputs.tag }} signed
          generate_release_notes: true
          files: Auren-Music-Player-${{ steps.release_tag.outputs.tag }}.apk
