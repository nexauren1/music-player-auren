name: Android Build & Release

# Nexauren Android CI/CD
# - Pull requests / main: build only
# - release/* branches: signed public release bootstrap
# - v* tags: signed public release
# - No standalone Actions artifact is used as the public release deliverable

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            RELEASE_TAG="v$VERSION"
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed production APK
        id: build
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
        run: |
          set -euo pipefail

          if [ -z "$AUREN_KEYSTORE_B64" ] ||              [ -z "$AUREN_KEY_ALIAS" ] ||              [ -z "$AUREN_KEY_PASS" ] ||              [ -z "$AUREN_STORE_PASS" ]; then
            echo "A signed release requires AUREN_KEYSTORE_B64, AUREN_KEY_ALIAS, AUREN_KEY_PASS and AUREN_STORE_PASS."
            exit 1
          fi

          printf '%s' "$AUREN_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$AUREN_KEYSTORE_PATH"
          test -s "$AUREN_KEYSTORE_PATH"
          keytool -list -keystore "$AUREN_KEYSTORE_PATH" -storepass "$AUREN_STORE_PASS" >/dev/null

          gradle --no-daemon clean assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" Nexauren-Music-Player.apk
          sha256sum Nexauren-Music-Player.apk > Nexauren-Music-Player.apk.sha256

          echo "mode=signed" >> "$GITHUB_OUTPUT"

      - name: Build validation APK (main / pull request)
        id: validation
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/pull/')
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify production APK identity
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING=$("$AAPT" dump badging Nexauren-Music-Player.apk)

          echo "$BADGING" | grep -F "package: name='com.auren.musicplayer'" >/dev/null
          echo "$BADGING" | grep -F "versionName='$VERSION'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='366'" >/dev/null

          echo "Verified package, version name and version code in release APK."

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## Nexauren Music Player $VERSION

          Nova release oficial do aplicativo com:

          - Ícone oficial Nexauren Music Player aplicado ao aplicativo.
          - Verificação automática de novas versões pelo GitHub Releases.
          - Aviso dentro do aplicativo quando existe uma atualização.
          - Notificação do Android quando uma nova versão é detectada.
          - Download e abertura do instalador Android para atualização.
          - Recuperação da instalação pendente ao voltar ao aplicativo.
          - APK de produção assinado com a mesma identidade da linha anterior.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               Nexauren-Music-Player.apk               Nexauren-Music-Player.apk.sha256               --clobber
            gh release edit "$RELEASE_TAG"               --title "Nexauren Music Player $VERSION"               --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG"               Nexauren-Music-Player.apk               Nexauren-Music-Player.apk.sha256               --title "Nexauren Music Player $VERSION"               --notes-file release-notes.md               --target "$GITHUB_SHA"
          fi

      - name: Build summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          {
            echo "## Nexauren Music Player"
            echo ""
            echo "- Version: `$VERSION`"
            echo "- Ref: `$GITHUB_REF_NAME`"
            if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_REF_NAME" == release/* ]]; then
              echo "- Public release: `$RELEASE_TAG`"
              echo "- APK: Nexauren-Music-Player.apk"
              echo "- Public artifact-only delivery: disabled"
            else
              echo "- Public release: not published (build validation only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
