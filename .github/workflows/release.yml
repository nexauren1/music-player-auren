name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools;platforms;android-35;build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Prepare release keystore
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
        run: |
          test -n "$AUREN_KEYSTORE_B64"
          echo "$AUREN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/auren-release.keystore"
          test -s "$RUNNER_TEMP/auren-release.keystore"

      - name: Build signed release APK
        env:
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK size: $APK_SIZE bytes"

      - name: Prepare release metadata
        id: release
        run: |
          RELEASE_TAG="v3.1.1-build.${GITHUB_RUN_NUMBER}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Auren-Music-Player-${RELEASE_TAG}.apk"
          sha256sum "Auren-Music-Player-${RELEASE_TAG}.apk" > "Auren-Music-Player-${RELEASE_TAG}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auren-Music-Player-${{ steps.release.outputs.tag }}
          path: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: Auren Music Player ${{ steps.release.outputs.tag }}
          body: |
            ## Auren Music Player ${{ steps.release.outputs.tag }}

            Signed release APK generated automatically from `main`.

            - Android package: `com.auren.musicplayer`
            - Version: `3.1.1`
            - APK is signed with the project's protected release key.
            - SHA-256 checksum is included as a release asset.
          files: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk.sha256
          fail_on_unmatched_files: true
