name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build APK
        id: build
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
        run: |
          set -euo pipefail

          if [ -n "$AUREN_KEYSTORE_B64" ]              && [ -n "$AUREN_KEY_ALIAS" ]              && [ -n "$AUREN_KEY_PASS" ]              && [ -n "$AUREN_STORE_PASS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"

            printf '%s' "$AUREN_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$AUREN_KEYSTORE_PATH"
            test -s "$AUREN_KEYSTORE_PATH"
            keytool -list -keystore "$AUREN_KEYSTORE_PATH" -storepass "$AUREN_STORE_PASS" >/dev/null

            gradle --no-daemon clean assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk Auren-Music-Player.apk
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"

            gradle --no-daemon clean assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk Auren-Music-Player.apk
            echo "mode=debug-signed" >> "$GITHUB_OUTPUT"
          fi

          test -s Auren-Music-Player.apk
          sha256sum Auren-Music-Player.apk > Auren-Music-Player.apk.sha256

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auren-Music-Player-v${{ steps.version.outputs.version }}
          path: |
            Auren-Music-Player.apk
            Auren-Music-Player.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.build.outputs.mode }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi

          if [ "${MODE}" = "signed" ]; then
            NOTE="Signed release APK."
          else
            NOTE="Debug-signed APK for free direct distribution/testing. A persistent release keystore can be added later for seamless updates."
          fi

          gh release create "${TAG}"             Auren-Music-Player.apk             Auren-Music-Player.apk.sha256             --title "Auren Music Player ${TAG}"             --notes "${NOTE}"
