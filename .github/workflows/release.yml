name: Build APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Automatic version bump
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e

          VERSION=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" \
            app/build.gradle | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read versionName"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          CURRENT_CODE=$(sed -n "s/.*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p" \
            app/build.gradle | head -n 1)
          CURRENT_CODE=${CURRENT_CODE:-1}
          NEXT_CODE=$((CURRENT_CODE + 1))

          sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode $NEXT_CODE/" \
            app/build.gradle
          sed -i -E "0,/versionName[[:space:]]+['\"][^'\"]+['\"]/s//versionName '$NEXT_VERSION'/" \
            app/build.gradle

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle
          git commit -m "chore: bump Auren version to $NEXT_VERSION [skip ci]"
          git push

          echo "Version: $VERSION -> $NEXT_VERSION"
          echo "Version code: $CURRENT_CODE -> $NEXT_CODE"

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.AUREN_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_HEX" ] || [ -z "$STORE_PASS" ] \
            || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing release signing secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/auren-signing"
          KEYSTORE_HEX=$(printf '%s' "$KEYSTORE_HEX" \
            | tr -d '[:space:]')
          if ! printf '%s' "$KEYSTORE_HEX" \
            | grep -Eq '^[0-9A-Fa-f]+$'; then
            echo "AUREN_KEYSTORE_B64 does not contain valid keystore data."
            exit 1
          fi
          if [ $(( ${#KEYSTORE_HEX} % 2 )) -ne 0 ]; then
            echo "Invalid HEX length for keystore."
            exit 1
          fi
          printf '%s' "$KEYSTORE_HEX" \
            | xxd -r -p \
            > "$RUNNER_TEMP/auren-signing/auren-release.keystore"
          test -s "$RUNNER_TEMP/auren-signing/auren-release.keystore"
          echo "AUREN_KEYSTORE_PATH=$RUNNER_TEMP/auren-signing/auren-release.keystore" \
            >> "$GITHUB_ENV"
          echo "AUREN_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "AUREN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUREN_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          "$SDKMANAGER" "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK 36 is ready"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" \
            app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Create delta update patch
        id: delta
        shell: bash
        run: |
          set -e
          NEW_APK="${{ steps.apk.outputs.path }}"
          VERSION="${{ steps.version.outputs.version }}"
          WORK="$RUNNER_TEMP/auren-delta"
          mkdir -p "$WORK"

          RELEASES_JSON="$WORK/releases.json"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: Auren-Music-Player" \
            "https://api.github.com/repos/nexauren1/music-player-auren/releases?per_page=20" \
            > "$RELEASES_JSON"

          OLD_APK_URL=$(jq -r --arg v "$VERSION" '
            .[]
            | ((.tag_name // "") | sub("^v"; "") | sub("-build\\..*$"; "")) as $old
            | select($old != $v)
            | .assets[]?
            | select(.name | endswith(".apk"))
            | .browser_download_url
          ' "$RELEASES_JSON" | head -n 1)

          OLD_VERSION=$(jq -r --arg v "$VERSION" '
            .[]
            | ((.tag_name // "") | sub("^v"; "") | sub("-build\\..*$"; "")) as $old
            | select($old != $v)
            | $old
          ' "$RELEASES_JSON" | head -n 1)

          if [ -z "$OLD_APK_URL" ] || [ -z "$OLD_VERSION" ]; then
            echo "No previous different-version APK found."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_APK="$WORK/Auren-Music-Player-$OLD_VERSION.apk"
          PATCH="$WORK/Auren-Music-Player-$OLD_VERSION-to-$VERSION.patch"
          VERIFY="$WORK/verified-$VERSION.apk"
          JBSDIFF_REPO="$WORK/jbsdiff"
          JBSDIFF="$JBSDIFF_REPO/target/jbsdiff-1.0.jar"

          echo "Previous version: $OLD_VERSION"
          curl -fL --retry 3 "$OLD_APK_URL" -o "$OLD_APK"

          git clone --depth 1 \
            https://github.com/malensek/jbsdiff.git \
            "$JBSDIFF_REPO"
          mvn -q -f "$JBSDIFF_REPO/pom.xml" clean package -DskipTests

          test -f "$JBSDIFF"

          java -jar "$JBSDIFF" diff \
            "$OLD_APK" "$NEW_APK" "$PATCH"

          java -jar "$JBSDIFF" patch \
            "$OLD_APK" "$VERIFY" "$PATCH"
          cmp "$NEW_APK" "$VERIFY"

          echo "Delta verified."
          echo "Full APK: $(stat -c%s "$NEW_APK") bytes"
          echo "Delta:    $(stat -c%s "$PATCH") bytes"

          cp "$PATCH" \
            "Auren-Music-Player-$OLD_VERSION-to-$VERSION.patch"
          echo "path=Auren-Music-Player-$OLD_VERSION-to-$VERSION.patch" \
            >> "$GITHUB_OUTPUT"

      - name: Create automatic release tag
        id: release_tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" \
            "Auren-Music-Player-${{ steps.release_tag.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}-signed
          target_commitish: ${{ github.sha }}
          name: Auren Music Player ${{ steps.release_tag.outputs.tag }} signed
          generate_release_notes: true
          files: |
            Auren-Music-Player-${{ steps.release_tag.outputs.tag }}.apk
            ${{ steps.delta.outputs.path }}
