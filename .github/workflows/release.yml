name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Check Gradle
        run: gradle --version

      - name: Prepare release keystore
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$AUREN_KEYSTORE_B64"
          test -n "$AUREN_STORE_PASS"

          KEYSTORE="$RUNNER_TEMP/auren-release.keystore"
          printf '%s' "$AUREN_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$AUREN_STORE_PASS" >/dev/null

      - name: Build signed release APK
        env:
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$AUREN_KEY_ALIAS"
          test -n "$AUREN_KEY_PASS"
          gradle --no-daemon clean assembleRelease --stacktrace

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "versionName ['\"][^'\"]+['\"]" app/build.gradle | head -1 | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare release files
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "Auren-Music-Player-${TAG}.apk"
          sha256sum "Auren-Music-Player-${TAG}.apk" > "Auren-Music-Player-${TAG}.apk.sha256"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Auren-Music-Player-${{ steps.release.outputs.tag }}
          path: |
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk
            Auren-Music-Player-${{ steps.release.outputs.tag }}.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG"             "Auren-Music-Player-$TAG.apk"             "Auren-Music-Player-$TAG.apk.sha256"             --title "Auren Music Player $TAG"             --notes "Signed APK for free direct distribution via GitHub Releases. Version $VERSION."
