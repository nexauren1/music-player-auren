name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Prepare release keystore
        env:
          AUREN_KEYSTORE_B64: ${{ secrets.AUREN_KEYSTORE_B64 }}
        run: |
          test -n "$AUREN_KEYSTORE_B64"
          echo "$AUREN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/auren-release.keystore"
          test -s "$RUNNER_TEMP/auren-release.keystore"

      - name: Build signed release APK
        env:
          AUREN_KEYSTORE_PATH: ${{ runner.temp }}/auren-release.keystore
          AUREN_KEY_ALIAS: ${{ secrets.AUREN_KEY_ALIAS }}
          AUREN_KEY_PASS: ${{ secrets.AUREN_KEY_PASS }}
          AUREN_STORE_PASS: ${{ secrets.AUREN_STORE_PASS }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK size: $APK_SIZE bytes"

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AurenMusic-${RELEASE_TAG}.apk"
          sha256sum "AurenMusic-${RELEASE_TAG}.apk" > "AurenMusic-${RELEASE_TAG}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurenMusic-${{ github.ref_name }}
          path: |
            AurenMusic-${{ github.ref_name }}.apk
            AurenMusic-${{ github.ref_name }}.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AurenMusic-${{ github.ref_name }}.apk
            AurenMusic-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
