plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auren.musicplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auren.musicplayer'
        minSdk 26
        targetSdk 35
        versionCode 325
        versionName '3.1.15'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('AUREN_KEYSTORE_PATH')
            def keyAliasValue = System.getenv('AUREN_KEY_ALIAS')
            def keyPasswordValue = System.getenv('AUREN_KEY_PASS')
            def storePasswordValue = System.getenv('AUREN_STORE_PASS')

            if (keystorePath && keyAliasValue && keyPasswordValue && storePasswordValue) {
                storeFile = file(keystorePath)
                storePassword = storePasswordValue
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
}
