plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auren.musicplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auren.musicplayer'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}
