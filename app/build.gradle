plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auren.musicplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.auren.musicplayer'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '2.0.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('AUREN_KEYSTORE_PATH'))
            storePassword System.getenv('AUREN_STORE_PASS')
            keyAlias System.getenv('AUREN_KEY_ALIAS')
            keyPassword System.getenv('AUREN_KEY_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    dependencies {
        implementation 'androidx.media3:media3-exoplayer:1.10.1'
        implementation 'androidx.core:core:1.17.0'
        implementation 'io.sigpipe:jbsdiff:1.0'
    }
}
